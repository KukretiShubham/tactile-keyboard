<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tactile web tests</title>
  <link rel="stylesheet" href="../../Sources/Tactile/Web/styles.css">
  <style>
    body { overflow: auto; font: 13px/1.5 ui-monospace, Menlo, monospace; background: #fff; color: #000; touch-action: auto; }
    .sandbox { position: fixed; left: 0; top: 0; width: 1180px; --u: 70px; --kh: 70px; --g: 6px; --deck-pad: 12px; }
    #results { position: relative; z-index: 10; background: #fff; }
    .pass { color: #1a7f37; } .fail { color: #cf222e; font-weight: bold; }
  </style>
</head>
<body data-skin="silver">
  <h1>Tactile web tests</h1>
  <ol id="results"></ol>
  <script type="module">
    import { run } from './harness.js';
    // Each test file registers its tests when imported.
    for (const file of ['keyboard', 'typing-model', 'shortcuts', 'trackpad']) await import(`./${file}.test.js`);
    await run();
  </script>
</body>
</html>
