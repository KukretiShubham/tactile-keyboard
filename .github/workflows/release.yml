# Publishes a release when a version tag (e.g. v1.0.0) is pushed: runs the
# checks, builds a universal Tactile.app signed with the release certificate,
# and attaches it as a zip with its SHA-256 checksum and a build provenance
# attestation, so anyone can verify the download was built here from the
# tagged code. The release notes are the tag's message.
#
# The certificate (repository secrets TACTILE_SIGNING_CERTIFICATE and
# TACTILE_SIGNING_PASSWORD, made by scripts/create-release-certificate.sh)
# keeps Tactile's Accessibility permission across updates, and installed
# copies update only to apps signed with it.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag matches the app's version
        run: |
          version="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Packaging/Info.plist)"
          if [[ "v$version" != "$GITHUB_REF_NAME" ]]; then
            echo "::error::Packaging/Info.plist says $version, but the tag is $GITHUB_REF_NAME."
            exit 1
          fi
      - name: Run the checks
        run: swift run tactile-checks
      - name: Load the release certificate
        env:
          CERTIFICATE: ${{ secrets.TACTILE_SIGNING_CERTIFICATE }}
          PASSWORD: ${{ secrets.TACTILE_SIGNING_PASSWORD }}
        run: |
          if [[ -z "$CERTIFICATE" || -z "$PASSWORD" ]]; then
            echo "::error::The release certificate secrets are missing; see Releasing in CONTRIBUTING.md."
            exit 1
          fi
          keychain="$RUNNER_TEMP/release.keychain-db"
          unlock="$(openssl rand -hex 16)"
          security create-keychain -p "$unlock" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$unlock" "$keychain"
          echo "$CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/release.p12"
          security import "$RUNNER_TEMP/release.p12" -k "$keychain" -P "$PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/release.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$unlock" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
      - name: Build Tactile.app
        run: RELEASE=1 UNIVERSAL=1 SIGNING_IDENTITY="Tactile Release Signing" scripts/build-app.sh
      - name: Package
        run: |
          zip="Tactile-$GITHUB_REF_NAME.zip"
          ditto -c -k --keepParent build/Tactile.app "$zip"
          shasum -a 256 "$zip" > "$zip.sha256"
      # GitHub only offers attestations for public repositories on personal plans.
      - name: Attest build provenance
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: Tactile-${{ github.ref_name }}.zip
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "Tactile-$GITHUB_REF_NAME.zip" "Tactile-$GITHUB_REF_NAME.zip.sha256" \
            --title "Tactile ${GITHUB_REF_NAME#v}" --notes-from-tag --verify-tag
      - name: Remove the release certificate
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/release.keychain-db" 2>/dev/null || true
